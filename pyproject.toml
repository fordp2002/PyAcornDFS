# Generated by Claude Opus 5.5 (claude-opus-5-5)
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyacorndfs"
dynamic = ["version"]
description = "Manipulate Acorn DFS .ssd, .dsd and .mmb disc images, with Tkinter and wxPython GUIs"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
dependencies = ["tkinterdnd2"]

[project.optional-dependencies]
wx = ["wxPython>=4.2"]
dev = ["pytest"]

[project.scripts]
pyacorndfs = "pyacorndfs.__main__:main"

[project.gui-scripts]
pyacorndfs-gui = "pyacorndfs.gui:main"
pyacorndfs-wx = "pyacorndfs.wx_gui:main"

[tool.setuptools.dynamic]
version = { attr = "pyacorndfs.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyacorndfs = ["dfs_floppy.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
